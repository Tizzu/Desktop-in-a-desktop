name: Release

# Si avvia pubblicando un tag di versione, ad esempio: git tag v0.2.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Il tag deve corrispondere alla versione in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Il tag $GITHUB_REF_NAME non corrisponde alla versione $version di package.json" >&2
            exit 1
          fi
      - run: npm run compile
      - run: npm test
      - run: npm run zip
      - name: Crea la release con lo zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip --title "$GITHUB_REF_NAME" --generate-notes
